name: Benchmarks

on:
  schedule:
    - cron: "43 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  record:
    name: Record Linux benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Record benchmark baseline
        shell: bash
        run: |
          set -o pipefail
          go test ./... -run '^$' -bench . -benchmem -benchtime=100ms -count=3 -timeout=40m | tee benchmarks.txt
      - name: Upload benchmark record
        uses: actions/upload-artifact@v7
        with:
          name: linux-amd64-go-benchmarks
          path: benchmarks.txt
          if-no-files-found: error
          retention-days: 90

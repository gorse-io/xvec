name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
          - windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: go test ./...
      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest'
        run: go test -coverprofile=coverage.txt -coverpkg=./... ./...
      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  linux-quality:
    name: Linux quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test without CGO
        env:
          CGO_ENABLED: "0"
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Persistence crash recovery
        shell: bash
        run: |
          go test ./internal/ailego -run '^TestWriteFileAtomicProcessKill$'
          go test ./internal/core -run '^TestV04DiskANNAtomicSaveProcessKill$'
          go test . -run '^TestAtomicDDLAndOptimizeCrashRecovery$'

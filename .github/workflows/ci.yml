name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
          - windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Windows ARM64 C toolchain
        if: matrix.os == 'windows-11-arm'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: mingw-w64-clang-aarch64-gcc-compat
      - name: Configure Windows ARM64 C compiler
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $cc = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'clangarm64\bin\gcc.exe'
          $target = & $cc -dumpmachine
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($target -ne 'aarch64-w64-windows-gnu') {
            Write-Error "Unexpected C compiler target: $target"
            exit 1
          }
          "CC=$cc" >> $env:GITHUB_ENV
      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: go test ./...
      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest'
        run: go test -coverprofile=coverage.txt -coverpkg=./... ./...
      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  simd:
    name: Test SIMD architectures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user
      - name: Test RISC-V RVV
        run: |
          make -C internal/ailego/math test-rvv
          make -C internal/ailego/math_batch test-rvv
          make -C pkg/rabitq/simd test-rvv
      - name: Test LoongArch LASX
        run: |
          make -C internal/ailego/math test-lasx
          make -C internal/ailego/math_batch test-lasx
          make -C pkg/rabitq/simd test-lasx
